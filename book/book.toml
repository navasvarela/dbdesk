[book]
title = "dbdesk user manual"
language = "en"
src = "src"

[output.html]
git-repository-url = "https://github.com/navasvarela/dbdesk"
edit-url-template = "https://github.com/navasvarela/dbdesk/edit/main/book/{path}"

# Fails the build on a link to a page or an image that doesn't exist. Anchors within pages
# aren't checked. Web links aren't followed: CI would then fail whenever some other site is
# down.
[output.linkcheck2]
follow-web-links = false
warning-policy = "error"
