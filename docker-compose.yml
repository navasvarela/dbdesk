# Database servers for the driver tests and manual testing, one service per engine (plus
# PostgreSQL again with TLS required):
#   docker compose up -d --wait
#   set -a; . ./test-servers.env; set +a
#   cargo test --workspace
# test-servers.env holds each service's DBROVER_TEST_*_URL; a test skips when its variable is
# unset. CI reads the same two files, so a new engine adds its service here and its URL there.
# The ports avoid clashing with servers already running on their usual ports.
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: dbrover
      POSTGRES_PASSWORD: dbrover
      POSTGRES_DB: dbrover
    ports:
      - "55432:5432"
    # Lets `docker compose up --wait` return only once the server accepts connections.
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "dbrover", "-d", "dbrover"]
      interval: 1s
      timeout: 5s
      retries: 30

  # Refuses unencrypted TCP connections (see docker/postgres-tls/pg_hba.conf). Its
  # certificate is signed by the test authority in docker/postgres-tls/ca.crt, which the
  # verify-full tests trust.
  postgres-tls:
    image: postgres:17
    environment:
      POSTGRES_USER: dbrover
      POSTGRES_PASSWORD: dbrover
      POSTGRES_DB: dbrover
    ports:
      - "55443:5432"
    volumes:
      - ./docker/postgres-tls:/tls:ro
    # PostgreSQL refuses a key file other users can read or that it doesn't own, and a
    # mounted file keeps the host's owner and mode, so the key is copied in first.
    entrypoint:
      - sh
      - -c
      - >-
        install -o postgres -m 600 /tls/server.key /var/lib/postgresql/server.key &&
        exec docker-entrypoint.sh postgres
        -c ssl=on
        -c ssl_cert_file=/tls/server.crt
        -c ssl_key_file=/var/lib/postgresql/server.key
        -c hba_file=/tls/pg_hba.conf
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "dbrover", "-d", "dbrover"]
      interval: 1s
      timeout: 5s
      retries: 30

  # MySQL 8.4 LTS. It makes a self-signed certificate on first start, so TLS works out of
  # the box. Binary logging is on by default, under which only a superuser may create
  # functions unless the server is told to trust their creators.
  mysql:
    image: mysql:8.4
    command: ["--log-bin-trust-function-creators=1"]
    environment:
      MYSQL_ROOT_PASSWORD: dbrover
      MYSQL_DATABASE: dbrover
      MYSQL_USER: dbrover
      MYSQL_PASSWORD: dbrover
    ports:
      - "55306:3306"
    # Over TCP, which only the real server listens on: the image's set-up server answers on
    # the socket alone, so a socket ping would pass too early.
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u", "dbrover", "-pdbrover", "--silent"]
      interval: 1s
      timeout: 5s
      retries: 60

  # MariaDB 11.4 LTS, through the same driver and tests as MySQL.
  mariadb:
    image: mariadb:11.4
    environment:
      MARIADB_ROOT_PASSWORD: dbrover
      MARIADB_DATABASE: dbrover
      MARIADB_USER: dbrover
      MARIADB_PASSWORD: dbrover
    ports:
      - "55307:3306"
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 1s
      timeout: 5s
      retries: 60

  # SQL Server 2022, Developer edition. Its image is built for x86-64 only: CI's Linux runner
  # runs it natively, and Docker on an Apple-silicon Mac only under emulation, where it is slow
  # and can crash. The image has no hook to create a database on first start, so the health
  # check does it, which also makes `up --wait` return only once the server accepts logins.
  # The sa password must pass SQL Server's complexity rule.
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    platform: linux/amd64
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: DbRover-Test-2026
    ports:
      - "51433:1433"
    healthcheck:
      test:
        - CMD
        - /opt/mssql-tools18/bin/sqlcmd
        - -C
        - -S
        - localhost
        - -U
        - sa
        - -P
        - DbRover-Test-2026
        - -Q
        - IF DB_ID('dbrover') IS NULL CREATE DATABASE dbrover
      interval: 2s
      timeout: 10s
      retries: 60
      start_period: 10s

  # ClickHouse 25.8 LTS, over HTTP on 8123 and HTTPS on 8443 (docker/clickhouse/https.xml),
  # with the certificate postgres-tls serves. The image only creates the user and database
  # when told to, and the user may then kill its own queries, which cancelling needs.
  clickhouse:
    image: clickhouse/clickhouse-server:25.8
    environment:
      CLICKHOUSE_USER: dbrover
      CLICKHOUSE_PASSWORD: dbrover
      CLICKHOUSE_DB: dbrover
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    ports:
      - "58123:8123"
      - "58443:8443"
    volumes:
      - ./docker/postgres-tls:/tls:ro
      - ./docker/clickhouse/https.xml:/etc/clickhouse-server/config.d/https.xml:ro
    # The user exists once a query as it works; HTTPS starts a moment after HTTP.
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          clickhouse-client --user dbrover --password dbrover --query 'SELECT 1' &&
          wget -qO- --no-check-certificate https://localhost:8443/ping
      interval: 1s
      timeout: 5s
      retries: 60

  # Redis 8, plain on 6379 and over TLS on 6380 with the certificate postgres-tls serves. The
  # tests sign in as the ACL user `dbrover`. A script answers other clients after 100 ms rather
  # than 5 s, so a test can kill one promptly, and DEBUG is allowed, for a command nothing
  # stops (`DEBUG SLEEP`).
  redis:
    image: redis:8-alpine
    ports:
      - "56379:6379"
      - "56443:6380"
    volumes:
      - ./docker/postgres-tls:/tls:ro
    command:
      - redis-server
      - --user
      - dbrover
      - "on"
      - ">dbrover"
      - "~*"
      - "&*"
      - "+@all"
      - --busy-reply-threshold
      - "100"
      - --enable-debug-command
      - "yes"
      - --tls-port
      - "6380"
      - --tls-cert-file
      - /tls/server.crt
      - --tls-key-file
      - /tls/server.key
      - --tls-auth-clients
      - "no"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG"]
      interval: 1s
      timeout: 5s
      retries: 30

  # Valkey 9, set up as the Redis service is, without TLS: the TLS code is the driver's, which
  # one server tests.
  valkey:
    image: valkey/valkey:9-alpine
    ports:
      - "56380:6379"
    command:
      - valkey-server
      - --user
      - dbrover
      - "on"
      - ">dbrover"
      - "~*"
      - "&*"
      - "+@all"
      - --busy-reply-threshold
      - "100"
      - --enable-debug-command
      - "yes"
    healthcheck:
      test: ["CMD-SHELL", "valkey-cli ping | grep -q PONG"]
      interval: 1s
      timeout: 5s
      retries: 30

  # OpenSSH on Alpine (docker/ssh), for the SSH tunnel tests: signs in `dbrover` with the test
  # keys there or its password, and forwards only to the postgres service. Built from a few
  # lines rather than pulled, so it stays a 10 MB image with fixed host and client keys.
  ssh:
    build: docker/ssh
    ports:
      - "55222:22"
    depends_on:
      postgres:
        condition: service_healthy
    # Listening is the only state sshd has to reach before it accepts logins.
    healthcheck:
      test: ["CMD-SHELL", "netstat -ltn | grep -q ':22 '"]
      interval: 1s
      timeout: 5s
      retries: 30
