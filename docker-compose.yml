# Database servers for the driver tests and manual testing, one service per engine (plus
# PostgreSQL again with TLS required):
#   docker compose up -d --wait
#   set -a; . ./test-servers.env; set +a
#   cargo test --workspace
# test-servers.env holds each service's DBDESK_TEST_*_URL; a test skips when its variable is
# unset. CI reads the same two files, so a new engine adds its service here and its URL there.
# The ports avoid clashing with servers already running on their usual ports.
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: dbdesk
      POSTGRES_PASSWORD: dbdesk
      POSTGRES_DB: dbdesk
    ports:
      - "55432:5432"
    # Lets `docker compose up --wait` return only once the server accepts connections.
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "dbdesk", "-d", "dbdesk"]
      interval: 1s
      timeout: 5s
      retries: 30

  # Refuses unencrypted TCP connections (see docker/postgres-tls/pg_hba.conf). Its
  # certificate is signed by the test authority in docker/postgres-tls/ca.crt, which the
  # verify-full tests trust.
  postgres-tls:
    image: postgres:17
    environment:
      POSTGRES_USER: dbdesk
      POSTGRES_PASSWORD: dbdesk
      POSTGRES_DB: dbdesk
    ports:
      - "55443:5432"
    volumes:
      - ./docker/postgres-tls:/tls:ro
    # PostgreSQL refuses a key file other users can read or that it doesn't own, and a
    # mounted file keeps the host's owner and mode, so the key is copied in first.
    entrypoint:
      - sh
      - -c
      - >-
        install -o postgres -m 600 /tls/server.key /var/lib/postgresql/server.key &&
        exec docker-entrypoint.sh postgres
        -c ssl=on
        -c ssl_cert_file=/tls/server.crt
        -c ssl_key_file=/var/lib/postgresql/server.key
        -c hba_file=/tls/pg_hba.conf
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "dbdesk", "-d", "dbdesk"]
      interval: 1s
      timeout: 5s
      retries: 30

  # MySQL 8.4 LTS. It makes a self-signed certificate on first start, so TLS works out of
  # the box. Binary logging is on by default, under which only a superuser may create
  # functions unless the server is told to trust their creators.
  mysql:
    image: mysql:8.4
    command: ["--log-bin-trust-function-creators=1"]
    environment:
      MYSQL_ROOT_PASSWORD: dbdesk
      MYSQL_DATABASE: dbdesk
      MYSQL_USER: dbdesk
      MYSQL_PASSWORD: dbdesk
    ports:
      - "55306:3306"
    # Over TCP, which only the real server listens on: the image's set-up server answers on
    # the socket alone, so a socket ping would pass too early.
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u", "dbdesk", "-pdbdesk", "--silent"]
      interval: 1s
      timeout: 5s
      retries: 60

  # MariaDB 11.4 LTS, through the same driver and tests as MySQL.
  mariadb:
    image: mariadb:11.4
    environment:
      MARIADB_ROOT_PASSWORD: dbdesk
      MARIADB_DATABASE: dbdesk
      MARIADB_USER: dbdesk
      MARIADB_PASSWORD: dbdesk
    ports:
      - "55307:3306"
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 1s
      timeout: 5s
      retries: 60
