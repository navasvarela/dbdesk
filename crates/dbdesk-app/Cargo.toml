[package]
name = "dbdesk-app"
description = "The dbdesk desktop application."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[[bin]]
name = "dbdesk"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
dbdesk-core.workspace = true
dbdesk-engine.workspace = true
dbdesk-mcp.workspace = true
dbdesk-sql.workspace = true
dbdesk-store.workspace = true
eframe.workspace = true
egui.workspace = true
egui_dock.workspace = true
egui_extras.workspace = true
egui-phosphor.workspace = true
image.workspace = true
jiff.workspace = true
rfd.workspace = true
semver.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-appender.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
egui_kittest = { workspace = true, features = ["eframe", "snapshot", "wgpu"] }
rmcp = { workspace = true, features = ["client", "transport-child-process"] }
rusqlite.workspace = true
tempfile.workspace = true
toml.workspace = true

[lints]
workspace = true

# How cargo-packager turns the release binary into a .app/.dmg, AppImage/.deb and an NSIS
# installer. The release workflow (.github/workflows/release.yml) builds the binary first and
# points --binaries-dir at it; see docs/releasing.md.
[package.metadata.packager]
productName = "dbdesk"
identifier = "io.github.navasvarela.dbdesk"
description = "Browse and Query databases"
longDescription = "A desktop database tool for PostgreSQL and SQLite: browse catalogs, run SQL in query consoles, and page through results."
homepage = "https://github.com/navasvarela/dbdesk"
authors = ["Juan Miguel Salamanca Zafra"]
publisher = "dbdesk"
copyright = "Copyright © 2026 Juan Miguel Salamanca Zafra and the dbdesk contributors"
category = "DeveloperTool"
icons = [
    "../../assets/brand/dbdesk.icns",
    "../../assets/brand/icon-32.png",
    "../../assets/brand/icon-128.png",
    "../../assets/brand/icon-256.png",
    "../../assets/brand/icon-512.png",
]
binaries = [{ path = "dbdesk", main = true }]
# Licences travel with the app: dbdesk's own, and the bundled fonts'.
resources = [
    { src = "../../LICENSE-MIT", target = "licenses/LICENSE-MIT" },
    { src = "../../LICENSE-APACHE", target = "licenses/LICENSE-APACHE" },
    { src = "../../assets/fonts/inter/LICENSE.txt", target = "licenses/fonts/Inter-LICENSE.txt" },
    { src = "../../assets/fonts/jetbrains-mono/OFL.txt", target = "licenses/fonts/JetBrainsMono-OFL.txt" },
]

[package.metadata.packager.macos]
minimumSystemVersion = "11.0"

[package.metadata.packager.deb]
section = "database"
# The rest (glibc, Wayland or X11) is on every desktop installation; passwords need a Secret
# Service (GNOME Keyring, KWallet), which is recommended rather than required.
depends = ["libxkbcommon0", "libgl1"]
