[package]
name = "dbdesk-driver-duckdb"
description = "DuckDB driver for dbdesk, with DuckDB inside: compiled, or linked from its prebuilt library."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
async-trait.workspace = true
dbdesk-core.workspace = true
# Only to read a statement's first word, to tell a change's row count from a result.
dbdesk-sql.workspace = true
tokio.workspace = true
tracing.workspace = true

# DuckDB compiled from its C++ sources, which takes 10 to 14 minutes on CI's runners, unless the
# build passes `--cfg dbdesk_prebuilt_duckdb` in RUSTFLAGS: then libduckdb-sys links the library
# packaging/duckdb/fetch.sh downloaded and checked. A cfg rather than a feature, because a
# feature can only add `bundled`, never take it away. See docs/duckdb-prebuilt.md.
[target.'cfg(not(dbdesk_prebuilt_duckdb))'.dependencies]
duckdb = { workspace = true, features = ["bundled", "parquet", "json"] }

[target.'cfg(dbdesk_prebuilt_duckdb)'.dependencies]
duckdb.workspace = true

[dev-dependencies]
dbdesk-core = { workspace = true, features = ["conformance"] }
tempfile.workspace = true

[lints]
workspace = true
