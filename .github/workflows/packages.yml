name: Packages

# Points the package managers at a release once a person has published it (docs/releasing.md,
# "Package managers"): the Homebrew cask in navasvarela/homebrew-tap, and a pull request to
# microsoft/winget-pkgs. Each job needs a token secret, and without it says so and does nothing.
# The AUR package is updated by hand. Run it by hand (Actions > Packages > Run workflow) to redo
# a release's bumps.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: The published release's tag, such as v0.13.0
        required: true

permissions:
  contents: read

concurrency:
  group: packages-${{ github.event.release.tag_name || inputs.tag }}

env:
  TAG: ${{ github.event.release.tag_name || inputs.tag }}
  GH_TOKEN: ${{ github.token }}

jobs:
  homebrew:
    if: ${{ !github.event.release.prerelease }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      # A fine-grained token with Contents: read and write on navasvarela/homebrew-tap only.
      TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
    steps:
      - if: env.TAP_TOKEN == ''
        run: echo "::notice::HOMEBREW_TAP_TOKEN isn't set; update Casks/dbrover.rb in navasvarela/homebrew-tap by hand."
      - if: env.TAP_TOKEN != ''
        uses: actions/checkout@v5
        with:
          repository: navasvarela/homebrew-tap
          token: ${{ env.TAP_TOKEN }}
      - name: Point the cask at the release
        if: env.TAP_TOKEN != ''
        run: |
          version="${TAG#v}"
          dmg="dbrover-$version-macos-universal.dmg"
          sha256=$(gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern SHA256SUMS --output - \
            | awk -v file="$dmg" '$2 == file { print $1 }')
          if [[ -z "$sha256" ]]; then
            echo "::error::$dmg isn't in $TAG's SHA256SUMS"
            exit 1
          fi
          sed -i -E \
            -e "s/^  version \".*\"$/  version \"$version\"/" \
            -e "s/^  sha256 \".*\"$/  sha256 \"$sha256\"/" \
            Casks/dbrover.rb
          if git diff --quiet; then
            echo "The cask is already at $version."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "dbrover $version"
          git push

  winget:
    if: ${{ !github.event.release.prerelease }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # A classic token with the public_repo scope: komac pushes the manifests to the token
      # owner's fork of winget-pkgs (forking it the first time) and opens the pull request.
      WINGET_TOKEN: ${{ secrets.WINGET_TOKEN }}
      KOMAC_VERSION: 2.17.1
      # From komac's SHA256SUMS for that version. Downloaded and checked here rather than
      # installed with the winget-releaser action, which installs komac with cargo-binstall from
      # its `main` branch while the token is in the environment.
      KOMAC_SHA256: e694e79cd451afabf47bead66ed34586fef4814f7b94e4b61a098f419978d5d7
    steps:
      - if: env.WINGET_TOKEN == ''
        run: echo "::notice::WINGET_TOKEN isn't set; submit the new version to winget-pkgs by hand with komac."
      - name: Find the installer
        id: installer
        if: env.WINGET_TOKEN != ''
        run: |
          version="${TAG#v}"
          installer="dbrover-$version-windows-x64-setup.exe"
          # The release workflow leaves the installer out unless WINDOWS_RELEASES is "true".
          if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' \
            | grep -qx "$installer"; then
            echo "::notice::$TAG has no $installer; nothing to submit to winget."
            exit 0
          fi
          echo "url=https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/$installer" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Install komac
        if: steps.installer.outputs.url != ''
        run: |
          archive="komac-$KOMAC_VERSION-x86_64-unknown-linux-gnu.tar.gz"
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/$archive" \
            "https://github.com/russellbanks/Komac/releases/download/v$KOMAC_VERSION/$archive"
          echo "$KOMAC_SHA256  $RUNNER_TEMP/$archive" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" komac
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - name: Open a pull request on winget-pkgs
        if: steps.installer.outputs.url != ''
        env:
          GITHUB_TOKEN: ${{ env.WINGET_TOKEN }}
          URL: ${{ steps.installer.outputs.url }}
          VERSION: ${{ steps.installer.outputs.version }}
        run: |
          komac update DbRover.DbRover --version "$VERSION" --urls "$URL" \
            --release-notes-url "https://github.com/$GITHUB_REPOSITORY/releases/tag/$TAG" \
            --submit
