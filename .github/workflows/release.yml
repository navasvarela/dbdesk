name: Release

# Builds the downloadable packages. See docs/releasing.md.
#
# - A tag `vX.Y.Z` on main: checks the tag against the version and that its commit is on main
#   (which only takes commits whose CI passed), builds and smoke-tests every package, and creates
#   a *draft* GitHub release for a person to publish.
# - Run by hand (Actions > Release > Run workflow): the same builds as a dry run, kept as
#   workflow artifacts, with no release.
# - A pull request that touches packaging: the builds and smoke tests only, so a broken package
#   fails the PR rather than the release.
on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/release.yml
      - packaging/**
      - crates/dbdesk-app/Cargo.toml
      - crates/dbdesk-app/build.rs
      - crates/dbdesk-driver-duckdb/Cargo.toml
      - crates/dbdesk-driver-duckdb/build.rs

permissions:
  contents: read

# A pull request's packaging dry run is superseded by its next push, so the older one is
# cancelled. Tag and manual runs each get a group of their own and always finish.
concurrency:
  group: release-${{ github.event_name == 'pull_request' && github.head_ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# cargo-packager, given `-p dbdesk-app`, resolves relative paths from the crate's folder and
# always packages `target/release/<binary>` under `--release` (`--binaries-dir` is ignored when
# its config comes from Cargo.toml). Hence the absolute `--out-dir`, and the macOS job copying
# its universal binary into target/release before packaging.
env:
  CARGO_TERM_COLOR: always
  # cargo-packager reads this to skip GUI steps meant for interactive machines.
  CI: "true"
  # Recorded by crates/dbdesk-app/build.rs and shown by `dbdesk --version`.
  DBDESK_COMMIT: ${{ github.sha }}
  CARGO_PACKAGER_VERSION: 0.11.8
  # Link DuckDB's prebuilt library rather than compile it; each job runs packaging/duckdb/fetch.sh
  # for its targets first. See docs/duckdb-prebuilt.md.
  RUSTFLAGS: --cfg dbdesk_prebuilt_duckdb

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v5
      - id: version
        run: |
          version=$(cargo metadata --format-version 1 --no-deps \
            | jq -r '.packages[] | select(.name == "dbdesk-app") | .version')
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_REF_TYPE" == tag && "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match the workspace version $version"
            exit 1
          fi

  # No CI here. main only takes pull requests whose required checks (fmt, book, and check on all
  # three systems) passed, so every commit on main has been through CI. Running it again took
  # three runners and 15-30 minutes. This only makes sure the tag is on main.
  on-main:
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: The tagged commit is on main
        run: |
          git fetch --quiet origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$GITHUB_REF_NAME points at a commit that isn't on main. Tag the release pull request's merge commit."
            exit 1
          fi

  macos:
    needs: [version, on-main]
    if: ${{ !cancelled() && needs.version.result == 'success' && needs.on-main.result != 'failure' }}
    runs-on: macos-latest
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-packager@${{ env.CARGO_PACKAGER_VERSION }}
      # One download for every Mac: both architectures, joined with lipo. Each links DuckDB's
      # static library for its own architecture.
      - name: Build a universal binary
        run: |
          for target in aarch64-apple-darwin x86_64-apple-darwin; do
            (
              set -a
              eval "$(packaging/duckdb/fetch.sh "$target" "$RUNNER_TEMP/duckdb")"
              set +a
              cargo build --release --locked -p dbdesk-app --target "$target"
            )
          done
          mkdir -p target/universal/release
          lipo -create -output target/universal/release/dbdesk \
            target/aarch64-apple-darwin/release/dbdesk \
            target/x86_64-apple-darwin/release/dbdesk
          lipo -archs target/universal/release/dbdesk
      # With the signing key set, cargo-packager also writes the update package the app
      # installs (dbdesk.app.tar.gz) and its signature. Pull requests from forks get no
      # secrets and skip both; the release job refuses a release without them.
      - name: Package
        env:
          CARGO_PACKAGER_SIGN_PRIVATE_KEY: ${{ secrets.CARGO_PACKAGER_SIGN_PRIVATE_KEY }}
          CARGO_PACKAGER_SIGN_PRIVATE_KEY_PASSWORD: ${{ secrets.CARGO_PACKAGER_SIGN_PRIVATE_KEY_PASSWORD }}
        run: |
          mkdir -p target/release
          cp target/universal/release/dbdesk target/release/dbdesk
          cargo packager -p dbdesk-app --release --formats app --out-dir "$GITHUB_WORKSPACE/dist"
          packaging/macos-dmg.sh dist/dbdesk.app "dist/dbdesk-$VERSION-macos-universal.dmg"
          if [[ -f dist/dbdesk.app.tar.gz ]]; then
            mv dist/dbdesk.app.tar.gz "dist/dbdesk-$VERSION-macos-universal.app.tar.gz"
            mv dist/dbdesk.app.tar.gz.sig "dist/dbdesk-$VERSION-macos-universal.app.tar.gz.sig"
            # The updater unpacks the archive's top folder as the new dbdesk.app.
            tar -tzf "dist/dbdesk-$VERSION-macos-universal.app.tar.gz" | head -1 | grep -qx 'dbdesk.app/'
          fi
      - name: Smoke test the disk image
        run: |
          mount=$(hdiutil attach -nobrowse -readonly "dist/dbdesk-$VERSION-macos-universal.dmg" \
            | awk -F'\t' '/\/Volumes\// {print $NF}')
          binary="$mount/dbdesk.app/Contents/MacOS/dbdesk"
          archs=$(lipo -archs "$binary")
          [[ "$archs" == *arm64* && "$archs" == *x86_64* ]] || { echo "::error::archs: $archs"; exit 1; }
          "$binary" --version | tee version.txt
          grep -q "dbdesk $VERSION" version.txt
          hdiutil detach -quiet "$mount"
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: |
            dist/*.dmg
            dist/*.app.tar.gz
            dist/*.app.tar.gz.sig
          if-no-files-found: error

  linux:
    needs: [version, on-main]
    if: ${{ !cancelled() && needs.version.result == 'success' && needs.on-main.result != 'failure' }}
    # The oldest supported runner: binaries need the glibc they were built against or newer,
    # so building here keeps the AppImage running on older distributions.
    runs-on: ubuntu-22.04
    env:
      VERSION: ${{ needs.version.outputs.version }}
      # linuxdeploy and appimagetool are AppImages themselves; this runs them without FUSE.
      APPIMAGE_EXTRACT_AND_RUN: "1"
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-packager@${{ env.CARGO_PACKAGER_VERSION }}
      - run: |
          sudo apt-get update
          sudo apt-get install -y libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libxkbcommon-dev libssl-dev file
      - run: packaging/duckdb/fetch.sh x86_64-unknown-linux-gnu "$RUNNER_TEMP/duckdb" | tee -a "$GITHUB_ENV"
      - run: cargo build --release --locked -p dbdesk-app
      # With the signing key set, cargo-packager signs the AppImage, which the app installs as
      # its update as is. The .deb's signature is dropped: the package manager updates it.
      - name: Package
        env:
          CARGO_PACKAGER_SIGN_PRIVATE_KEY: ${{ secrets.CARGO_PACKAGER_SIGN_PRIVATE_KEY }}
          CARGO_PACKAGER_SIGN_PRIVATE_KEY_PASSWORD: ${{ secrets.CARGO_PACKAGER_SIGN_PRIVATE_KEY_PASSWORD }}
        run: |
          cargo packager -p dbdesk-app --release --formats appimage,deb \
            --out-dir "$GITHUB_WORKSPACE/dist"
          # Rename to the names the release notes and manual use. cargo-packager's .deb name
          # already matches, and `mv` refuses to move a file onto itself.
          rename() { [[ "$1" == "$2" ]] || mv "$1" "$2"; }
          rename dist/*.AppImage "dist/dbdesk-$VERSION-x86_64.AppImage"
          rename dist/*.deb "dist/dbdesk_${VERSION}_amd64.deb"
          if compgen -G "dist/*.AppImage.sig" > /dev/null; then
            rename dist/*.AppImage.sig "dist/dbdesk-$VERSION-x86_64.AppImage.sig"
          fi
          rm -f dist/*.deb.sig
      - name: Smoke test the AppImage and the .deb
        run: |
          "dist/dbdesk-$VERSION-x86_64.AppImage" --appimage-extract-and-run --version | tee appimage.txt
          grep -q "dbdesk $VERSION" appimage.txt
          dpkg-deb --info "dist/dbdesk_${VERSION}_amd64.deb"
          dpkg-deb -x "dist/dbdesk_${VERSION}_amd64.deb" deb-root
          deb-root/usr/bin/dbdesk --version | tee deb.txt
          grep -q "dbdesk $VERSION" deb.txt
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: |
            dist/*.AppImage
            dist/*.AppImage.sig
            dist/*.deb
          if-no-files-found: error

  windows:
    needs: [version, on-main]
    if: ${{ !cancelled() && needs.version.result == 'success' && needs.on-main.result != 'failure' }}
    runs-on: windows-2022
    env:
      VERSION: ${{ needs.version.outputs.version }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-packager@${{ env.CARGO_PACKAGER_VERSION }}
      - run: packaging/duckdb/fetch.sh x86_64-pc-windows-msvc "$RUNNER_TEMP/duckdb" | tee -a "$GITHUB_ENV"
      - run: cargo build --release --locked -p dbdesk-app
      # dbdesk.exe loads duckdb.dll from its own folder. cargo-packager's resources apply to
      # every platform, so the Windows package gets a configuration of its own: the one in
      # Cargo.toml plus the DLL, written beside Cargo.toml so its relative paths still resolve.
      - name: Package
        run: |
          dll="$(cygpath -m "$DUCKDB_LIB_DIR")/duckdb.dll"
          cp "$dll" target/release/
          cargo metadata --format-version 1 --no-deps | jq \
            --arg dll "$dll" --arg version "$VERSION" --arg bin "$(cygpath -m "$PWD/target/release")" \
            '.packages[] | select(.name == "dbdesk-app") | .metadata.packager
              + {name: "dbdesk-app", version: $version, binariesDir: $bin}
              | .resources += [{src: $dll, target: "duckdb.dll"}]' \
            > crates/dbdesk-app/packager-windows.json
          cargo packager --config crates/dbdesk-app/packager-windows.json --release --formats nsis \
            --out-dir "$(cygpath -m "$GITHUB_WORKSPACE/dist")"
          mv dist/*-setup.exe "dist/dbdesk-$VERSION-windows-x64-setup.exe"
      - name: Smoke test
        run: |
          target/release/dbdesk.exe --version | tee version.txt
          grep -q "dbdesk $VERSION" version.txt
      # The installed copy, with no DuckDB on PATH: it must find the DLL beside itself.
      - name: Smoke test the installer
        shell: pwsh
        run: |
          $env:Path = ($env:Path -split ';' | Where-Object { $_ -notlike '*duckdb*' }) -join ';'
          $installer = Start-Process -Wait -PassThru "dist/dbdesk-$env:VERSION-windows-x64-setup.exe" `
            -ArgumentList '/S', "/D=$env:RUNNER_TEMP\dbdesk-installed"
          if ($installer.ExitCode -ne 0) { throw "installer exit code $($installer.ExitCode)" }
          Get-ChildItem "$env:RUNNER_TEMP\dbdesk-installed"
          $version = & "$env:RUNNER_TEMP\dbdesk-installed\dbdesk.exe" --version
          $version
          if ("$version" -notlike "dbdesk $env:VERSION*") { throw "unexpected version: $version" }
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/*-setup.exe
          if-no-files-found: error

  release:
    if: github.ref_type == 'tag'
    needs: [version, macos, linux, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      # The Windows installer is built and tested on every release but only attached once
      # someone has tried it on a real Windows machine and set the repository variable
      # WINDOWS_RELEASES to "true" (Settings > Secrets and variables > Actions > Variables).
      - if: vars.WINDOWS_RELEASES != 'true'
        run: rm -f dist/*-setup.exe
      # The manifest installed copies read to update themselves (crates/dbdesk-app/src/
      # updates.rs reads it through `releases/latest/download/latest.json`). The universal
      # macOS package serves both Mac architectures. A missing signature fails the release:
      # a release that can't be installed as an update must not become the latest.
      - name: Update manifest
        working-directory: dist
        run: |
          base="https://github.com/$GITHUB_REPOSITORY/releases/download/$GITHUB_REF_NAME"
          mac="dbdesk-$VERSION-macos-universal.app.tar.gz"
          linux="dbdesk-$VERSION-x86_64.AppImage"
          jq -n \
            --arg version "$VERSION" \
            --arg notes "https://github.com/$GITHUB_REPOSITORY/releases/tag/$GITHUB_REF_NAME" \
            --arg date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg mac_url "$base/$mac" --rawfile mac_sig "$mac.sig" \
            --arg linux_url "$base/$linux" --rawfile linux_sig "$linux.sig" \
            '{
              version: $version, notes: $notes, pub_date: $date,
              platforms: {
                "macos-aarch64": {url: $mac_url, signature: ($mac_sig | rtrimstr("\n")), format: "app"},
                "macos-x86_64": {url: $mac_url, signature: ($mac_sig | rtrimstr("\n")), format: "app"},
                "linux-x86_64": {url: $linux_url, signature: ($linux_sig | rtrimstr("\n")), format: "appimage"}
              }
            }' > latest.json
          rm -- *.sig
          cat latest.json
      - name: Checksums
        working-directory: dist
        run: sha256sum -- * | tee SHA256SUMS
      - name: Draft the release
        run: |
          generated=$(gh api "repos/$GITHUB_REPOSITORY/releases/generate-notes" \
            -f tag_name="$GITHUB_REF_NAME" --jq .body)
          { cat packaging/release-notes.md; echo; echo "$generated"; } > notes.md
          gh release create "$GITHUB_REF_NAME" dist/* --draft \
            --title "dbdesk $VERSION" --notes-file notes.md
