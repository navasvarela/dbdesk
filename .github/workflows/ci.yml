name: CI

on:
  push:
    branches: [main]
  pull_request:
  # The release workflow runs the full suite on the commit it packages.
  workflow_call:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  # The user manual in book/. A broken link to a page or an image fails the build.
  book:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: taiki-e/install-action@v2
        with:
          tool: mdbook@0.5.4,mdbook-linkcheck2@0.13.0
      - run: mdbook build book

  check:
    strategy:
      fail-fast: false
      matrix:
        # Windows builds and runs the tests, but dbdesk hasn't been tried on a real Windows
        # machine yet; see docs/releasing.md.
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      # Headers eframe's windowing backends link against on Linux (same list egui's own CI uses).
      - if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libxkbcommon-dev libssl-dev
      # GitHub only runs containers on Linux runners, so the Postgres tests are skipped on
      # macOS and Windows (they check DBDESK_TEST_POSTGRES_URL); the SQLite ones still run.
      - if: runner.os == 'Linux'
        name: Start PostgreSQL
        run: |
          docker compose up -d --wait
          echo "DBDESK_TEST_POSTGRES_URL=postgres://dbdesk:dbdesk@localhost:55432/dbdesk" >> "$GITHUB_ENV"
      - run: cargo clippy --workspace --all-targets
      - run: cargo test --workspace
