name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      # Headers eframe's windowing backends link against on Linux (same list egui's own CI uses).
      - if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libxkbcommon-dev libssl-dev
      # GitHub only runs containers on Linux runners, so the Postgres tests are skipped on
      # macOS (they check DBDESK_TEST_POSTGRES_URL) and the SQLite ones still run there.
      - if: runner.os == 'Linux'
        name: Start PostgreSQL
        run: |
          docker compose up -d --wait
          echo "DBDESK_TEST_POSTGRES_URL=postgres://dbdesk:dbdesk@localhost:55432/dbdesk" >> "$GITHUB_ENV"
      - run: cargo clippy --workspace --all-targets
      - run: cargo test --workspace
