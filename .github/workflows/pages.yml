name: Pages

# Builds the website (site/) and the user manual (book/), and publishes them to GitHub Pages
# from main. Pull requests that touch either only build them, so a broken site fails the PR
# without going live.
on:
  push:
    branches: [main]
  pull_request:
    paths:
      - .github/workflows/pages.yml
      - site/**
      - book/**
      - assets/**
  # Publishing a release rebuilds the page, which is when its download links move to the new
  # version: before that, the release's files don't exist yet.
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release the page links to (empty means GitHub's latest)
        required: false

permissions:
  contents: read

# Deployments from main run one at a time: a newer push supersedes a queued one, but never
# cancels a deployment already running. Pull requests only build, so each has its own group and
# a newer push cancels its older build. They used to share the deployments' group, which marked
# every other pull request's build as cancelled.
concurrency:
  group: pages-${{ github.event_name == 'pull_request' && github.head_ref || 'deploy' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # A release event runs on the release's tag, and a Pages deployment from a tag succeeds but is
  # never served: v0.15.0's and v0.16.0's both stayed unserved until a run from main went live
  # for the same commit. So a release only starts a run on main, passing the tag along.
  # GITHUB_TOKEN can start a workflow_dispatch run, unlike most events it causes.
  redeploy:
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          PUBLISHED_TAG: ${{ !github.event.release.prerelease && github.event.release.tag_name || '' }}
        run: gh workflow run pages.yml --repo "$GITHUB_REPOSITORY" --ref "$DEFAULT_BRANCH" -f tag="$PUBLISHED_TAG"

  build:
    if: github.event_name != 'release'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: taiki-e/install-action@v2
        with:
          tool: mdbook@0.5.4,mdbook-linkcheck2@0.13.0
      # GitHub's latest release is never a draft, so the page only links to files that exist.
      # Publishing a release is the exception: for a few seconds afterwards GitHub can still
      # report the previous release as the latest, and v0.15.0's page went out naming v0.14.0.
      # So the run a release starts takes the version from the release it was published for. A
      # prerelease is never the latest, so it falls back to asking GitHub.
      - id: release
        env:
          GH_TOKEN: ${{ github.token }}
          PUBLISHED_TAG: ${{ inputs.tag }}
        run: |
          tag=${PUBLISHED_TAG:-$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName)}
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"
      - run: site/build.sh _site
        env:
          DBROVER_SITE_VERSION: ${{ steps.release.outputs.version }}
          # Cloudflare Web Analytics' site token for dbrover.org. It isn't a secret: every page
          # carries it. Pull requests build without it, so their builds aren't counted.
          DBROVER_ANALYTICS_TOKEN: ${{ github.event_name != 'pull_request' && '6ffdc78e93054aa2a6e89f5a0187c729' || '' }}
      # The manual's links are checked by its own build; this checks the landing page's links
      # to its assets and into the manual. Web links aren't followed, as in the manual.
      - uses: lycheeverse/lychee-action@v2
        with:
          args: --offline --no-progress --root-dir "${{ github.workspace }}/_site" _site/index.html
          fail: true
      - if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
