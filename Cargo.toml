[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "MIT OR Apache-2.0"
repository = "https://github.com/navasvarela/dbdesk"
publish = false

[workspace.dependencies]
dbdesk-core = { path = "crates/dbdesk-core" }
dbdesk-driver-mysql = { path = "crates/dbdesk-driver-mysql" }
dbdesk-driver-postgres = { path = "crates/dbdesk-driver-postgres" }
dbdesk-driver-sqlite = { path = "crates/dbdesk-driver-sqlite" }
dbdesk-engine = { path = "crates/dbdesk-engine" }
dbdesk-sql = { path = "crates/dbdesk-sql" }
dbdesk-store = { path = "crates/dbdesk-store" }

anyhow = "1.0.104"
async-trait = "0.1.92"
directories = "6.0.0"
eframe = { version = "0.36.2", default-features = false, features = [
    "accesskit",
    "default_fonts",
    "glow",
    "persistence",
    "wayland",
    "x11",
] }
# egui_dock 0.21 is built against egui 0.36; bump the egui family only together with it.
egui = "0.36.2"
egui_dock = { version = "0.21.1", features = ["serde"] }
# "svg" renders the database logos (assets/icons/databases) with resvg.
egui_extras = { version = "0.36.2", features = ["image", "svg"] }
egui_kittest = "0.36.2"
# Icon font; 0.14 is the release built against egui 0.36.
egui-phosphor = "0.14.0"
# Decodes the PNGs egui_extras loads (the logo on the Welcome tab).
image = { version = "0.25.10", default-features = false, features = ["png"] }
futures-util = { version = "0.3.34", default-features = false, features = ["std"] }
jiff = "0.2.38"
keyring = "4.2.0"
# MySQL and MariaDB. No default features, which compress with the zlib C library:
# `minimal-rust` compresses in pure Rust, and TLS is rustls with ring. Its rustls connector
# takes rustls's process-wide provider, so ring must stay the only provider compiled in
# (dbdesk-driver-mysql's tests check it).
mysql_async = { version = "0.37.1", default-features = false, features = ["minimal-rust", "rustls-tls", "ring", "tls12"] }
rfd = "0.17.2"
rusqlite = { version = "0.40.2", features = ["bundled", "column_decltype"] }
# TLS for network connections. rustls rather than OpenSSL leaves nothing to link (see
# docs/releasing.md), and the ring provider builds with only a C compiler, where aws-lc-rs
# also wants CMake and NASM on Windows.
rustls = { version = "0.23.45", default-features = false, features = ["ring", "std", "tls12", "logging"] }
serde = { version = "1.0.229", features = ["derive"] }
# The syntax checker's parser, for PostgreSQL and SQLite statements.
sqlparser = "0.63.0"
# `preserve_order` so the cell viewer pretty-prints JSON without sorting its keys.
serde_json = { version = "1.0.150", features = ["preserve_order"] }
tempfile = "3.27.0"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "sync", "time", "macros"] }
tokio-postgres = "0.7.18"
tokio-postgres-rustls = { version = "0.14.0", features = ["ring"] }
toml = "1.1.8"
tracing = "0.1.44"
tracing-appender = "0.2.5"
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["fmt", "registry", "std", "tracing-log"] }
uuid = { version = "1.28.0", features = ["v4", "serde"] }
# The public web authorities, trusted by `verify-full` when no CA file is given.
webpki-roots = "1.0.9"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
expect_used = "deny"
unwrap_used = "deny"

# What release builds ship. Thin LTO with one codegen unit trades a slower release build for a
# smaller binary, and debug symbols are stripped from what ships. Measured on an Apple-silicon
# Mac when this was added (R1): the binary went from 19.5 MB to 14.6 MB, and a clean release
# build of the app from about 51 s to 63 s.
[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
